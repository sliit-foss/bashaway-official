name: build
description: Base build action for the project
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node.js 24 and setup dependency caching
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --ignore-scripts
      shell: bash

    - name: Build changes
      run: pnpm build
      shell: bash
